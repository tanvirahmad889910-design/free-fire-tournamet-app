<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Registration - FF Tournament</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b0b12;
      color: white;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    h1 {
      text-align: center;
      color: #ffb000;
      margin: 15px 0 8px;
    }

    .subtitle {
      text-align: center;
      color: #999;
      margin-bottom: 25px;
      font-size: 14px;
    }

    .box {
      background: #151522;
      padding: 20px;
      border-radius: 18px;
      border: 1px solid #29293b;
    }

    h2 {
      color: #ffb000;
      font-size: 17px;
      margin: 20px 0 12px;
    }

    h2:first-child {
      margin-top: 0;
    }

    label {
      display: block;
      color: #ccc;
      font-size: 13px;
      margin: 12px 0 7px;
    }

    input, select {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #303044;
      background: #0d0d16;
      color: white;
      outline: none;
      font-size: 14px;
    }

    .player {
      background: #0e0e18;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 12px;
    }

    button {
      width: 100%;
      border: 0;
      padding: 15px;
      margin-top: 20px;
      border-radius: 12px;
      background: linear-gradient(135deg, #ffb000, #ff5e00);
      color: #111;
      font-size: 16px;
      font-weight: bold;
    }

    #message {
      display: none;
      margin-top: 15px;
      padding: 15px;
      border-radius: 12px;
      text-align: center;
    }

    .success {
      background: #12351e;
      color: #75ff99;
    }

    .error {
      background: #3b1515;
      color: #ff7777;
    }

    .back {
      display: block;
      text-align: center;
      color: #aaa;
      margin-top: 18px;
      text-decoration: none;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🔥 Team Registration</h1>
  <p class="subtitle">Free Fire Tournament</p>

  <div class="box">

    <form id="registrationForm">

      <h2>🏆 Tournament</h2>

      <label>Tournament</label>
      <select id="tournament" required>
        <option value="">Select Tournament</option>
        <option>Friday Night Battle</option>
        <option>Weekly Championship</option>
        <option>Pro League</option>
      </select>


      <h2>👥 Team Information</h2>

      <label>Team Name</label>
      <input id="teamName" type="text" placeholder="Team Name" required>

      <label>Captain Name</label>
      <input id="captainName" type="text" placeholder="Captain Name" required>

      <label>WhatsApp / Phone</label>
      <input id="phone" type="tel" placeholder="01XXXXXXXXX" required>


      <h2>🎮 Players</h2>

      <div class="player">
        <label>Player 1 — Captain</label>
        <input id="player1" type="text" placeholder="Player Name" required>

        <label>Free Fire UID</label>
        <input id="uid1" type="text" placeholder="UID" required>
      </div>

      <div class="player">
        <label>Player 2</label>
        <input id="player2" type="text" placeholder="Player Name" required>

        <label>Free Fire UID</label>
        <input id="uid2" type="text" placeholder="UID" required>
      </div>

      <div class="player">
        <label>Player 3</label>
        <input id="player3" type="text" placeholder="Player Name" required>

        <label>Free Fire UID</label>
        <input id="uid3" type="text" placeholder="UID" required>
      </div>

      <div class="player">
        <label>Player 4</label>
        <input id="player4" type="text" placeholder="Player Name" required>

        <label>Free Fire UID</label>
        <input id="uid4" type="text" placeholder="UID" required>
      </div>


      <h2>💳 Payment</h2>

      <label>Payment Method</label>
      <select id="payment" required>
        <option value="">Select Method</option>
        <option>bKash</option>
        <option>Nagad</option>
        <option>Rocket</option>
      </select>

      <label>Transaction ID</label>
      <input id="transactionId" type="text"
             placeholder="Transaction ID" required>


      <button type="submit" id="submitBtn">
        ✅ Submit Registration
      </button>

      <div id="message"></div>

    </form>

  </div>

  <a class="back" href="index.html">← Back to Home</a>

</div>


<script type="module">

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getFirestore,
    collection,
    addDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


  const firebaseConfig = {
    apiKey: "AIzaSyDN9yr2JTG5bG0o46kW4gae8vM4f4d4l3M",
    authDomain: "ff-tournament-c9a0b.firebaseapp.com",
    projectId: "ff-tournament-c9a0b",
    storageBucket: "ff-tournament-c9a0b.firebasestorage.app",
    messagingSenderId: "59873774109",
    appId: "1:59873774109:web:229f05e2b53631dd4b14f4",
    measurementId: "G-P005P15RK4"
  };


  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);


  document
    .getElementById("registrationForm")
    .addEventListener("submit", async function(e) {

      e.preventDefault();

      const button = document.getElementById("submitBtn");
      const message = document.getElementById("message");

      button.disabled = true;
      button.textContent = "Submitting...";

      try {

        await addDoc(collection(db, "registrations"), {

          tournament:
            document.getElementById("tournament").value,

          teamName:
            document.getElementById("teamName").value.trim(),

          captainName:
            document.getElementById("captainName").value.trim(),

          phone:
            document.getElementById("phone").value.trim(),

          players: [
            {
              name: document.getElementById("player1").value.trim(),
              uid: document.getElementById("uid1").value.trim()
            },
            {
              name: document.getElementById("player2").value.trim(),
              uid: document.getElementById("uid2").value.trim()
            },
            {
              name: document.getElementById("player3").value.trim(),
              uid: document.getElementById("uid3").value.trim()
            },
            {
              name: document.getElementById("player4").value.trim(),
              uid: document.getElementById("uid4").value.trim()
            }
          ],

          paymentMethod:
            document.getElementById("payment").value,

          transactionId:
            document.getElementById("transactionId").value.trim(),

          status: "pending",

          createdAt: serverTimestamp()

        });


        message.className = "success";
        message.style.display = "block";
        message.innerHTML =
          "🎉 Registration সফল হয়েছে!<br>" +
          "Admin verification-এর পর Team approve হবে.";

        document.getElementById("registrationForm").reset();

      } catch (error) {

        console.error(error);

        message.className = "error";
        message.style.display = "block";
        message.textContent =
          "❌ Registration হয়নি। আবার চেষ্টা করুন।";

      }

      button.disabled = false;
      button.textContent = "✅ Submit Registration";

    });

</script>

</body>
</html>
